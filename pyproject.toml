[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygame-m"
version = "0.1.0"
description = "Proyecto educativo para aprender a estructurar juegos con Pygame"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5.5",
]

[tool.setuptools.packages.find]
where = ["src"]
